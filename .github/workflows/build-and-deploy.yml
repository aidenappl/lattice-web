name: Build and Deploy to Registry

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  resolve-version:
    runs-on: ${{ fromJSON(vars.LATTICE_CI_RUNS_ON || '["self-hosted","lattice-worker"]') }}
    outputs:
      version: ${{ steps.version.outputs.value }}
      is_release: ${{ steps.version.outputs.is_release }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        # MSG comes in via env, never via ${{ }} interpolation into the script.
        # Expanded inline, a commit message containing a quote or paren is
        # pasted in as shell source and the step dies with a syntax error.
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          IS_RELEASE=false

          if echo "$MSG" | grep -qE '\[release-(patch|minor|major)\]'; then
            IS_RELEASE=true

            if echo "$MSG" | grep -q '\[release-major\]'; then
              BUMP=major
            elif echo "$MSG" | grep -q '\[release-minor\]'; then
              BUMP=minor
            else
              BUMP=patch
            fi

            git fetch --tags
            LATEST=$(git tag --list 'v*' --sort=-version:refname | head -n 1)
            [ -z "$LATEST" ] && LATEST="v0.0.0"

            VER="${LATEST#v}"
            MAJOR=$(echo "$VER" | cut -d. -f1)
            MINOR=$(echo "$VER" | cut -d. -f2)
            PATCH=$(echo "$VER" | cut -d. -f3)

            if   [ "$BUMP" = "major" ]; then MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0
            elif [ "$BUMP" = "minor" ]; then MINOR=$((MINOR+1)); PATCH=0
            else PATCH=$((PATCH+1))
            fi

            VERSION_VALUE="v${MAJOR}.${MINOR}.${PATCH}"
          else
            VERSION_VALUE=$(git rev-parse --short HEAD)
          fi

          echo "value=$VERSION_VALUE" >> "$GITHUB_OUTPUT"
          echo "is_release=$IS_RELEASE" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION_VALUE (is_release: $IS_RELEASE)"

  test:
    runs-on: ${{ fromJSON(vars.LATTICE_CI_RUNS_ON || '["self-hosted","lattice-worker"]') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          # Self-hosted runners share ~/.npm; GitHub's cache upload is slow and useless here.
          package-manager-cache: false
          node-version: 20

      - name: Install dependencies
        run: npm ci

      # Typecheck rather than `next build`: the Docker build in build-and-push
      # already compiles the app, and this fails in seconds with a clearer error.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

  build-and-push:
    runs-on: ${{ fromJSON(vars.LATTICE_CI_RUNS_ON || '["self-hosted","lattice-worker"]') }}
    needs: [resolve-version, test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Inject Keyring secrets
        id: keyring
        uses: aidenappl/keyring-actions@v1
        with:
          url: ${{ secrets.KEYRING_URL }}
          access-key-id: ${{ secrets.KEYRING_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.KEYRING_SECRET_ACCESS_KEY }}

      # The host's shared BuildKit, not docker/setup-buildx-action: that races
      # with other runners on the shared Docker daemon. Its local layer cache
      # persists between builds, so there is no gha cache (it fails through a
      # remote builder anyway).
      # Lattice must still build when the CI host is down (it is what you would
      # use to fix it): set the repo variable LATTICE_CI_RUNS_ON to
      # ["ubuntu-latest"] and every job runs GitHub-hosted, building with
      # setup-buildx below instead of lattice-builder.
      - name: Set up Docker Buildx (GitHub-hosted fallback)
        if: runner.environment == 'github-hosted'
        uses: docker/setup-buildx-action@v4

      - name: Use lattice-builder
        if: runner.environment == 'self-hosted'
        run: |
          docker buildx inspect lattice-builder >/dev/null 2>&1 \
            || docker buildx create --name lattice-builder --driver remote tcp://127.0.0.1:1234
          docker buildx inspect lattice-builder

      - name: Login to Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY_URL }}
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ env.REGISTRY_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY_URL }}/${{ github.event.repository.name }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          builder: ${{ runner.environment == 'self-hosted' && 'lattice-builder' || '' }}
          provenance: false
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_APP_VERSION=${{ needs.resolve-version.outputs.version }}
            NEXT_PUBLIC_LATTICE_API=${{ env.NEXT_PUBLIC_LATTICE_API }}

      - name: Summary
        run: |
          echo "Image pushed: ${{ env.REGISTRY_URL }}/${{ github.event.repository.name }}:latest @ ${{ needs.resolve-version.outputs.version }}"

  create-release:
    runs-on: ${{ fromJSON(vars.LATTICE_CI_RUNS_ON || '["self-hosted","lattice-worker"]') }}
    needs: [resolve-version, build-and-push]
    if: needs.resolve-version.outputs.is_release == 'true'
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.resolve-version.outputs.version }}
          name: ${{ needs.resolve-version.outputs.version }}
          generate_release_notes: true
