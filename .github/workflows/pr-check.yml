name: PR check

# APL-112: every PR into main runs the same checks build-and-deploy runs on
# main (tests, typecheck), plus a full `next build`, so a broken build is
# caught before merge instead of at the image build. No secrets: the build only
# needs a placeholder API URL, since NEXT_PUBLIC_* values are inlined at build
# time and nothing is deployed from here.
on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    # Same runner choice as build-and-deploy: the self-hosted Lattice workers,
    # or GitHub-hosted when the repo variable LATTICE_CI_RUNS_ON says so.
    runs-on: ${{ fromJSON(vars.LATTICE_CI_RUNS_ON || '["self-hosted","lattice-worker"]') }}
    env:
      NEXT_PUBLIC_LATTICE_API: https://lattice-api.example.invalid
      NEXT_PUBLIC_APP_VERSION: pr-${{ github.event.pull_request.number }}
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          # Self-hosted runners share ~/.npm; GitHub's cache upload is slow and useless here.
          package-manager-cache: false
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npx vitest run

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npx next build
